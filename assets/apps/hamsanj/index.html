<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HamSanj - Peer Evaluation System</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    #HamSanj-app * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="HamSanj-app">
    <div id="root"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, getDocs, query, where, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDbAgwMiEAZCezKy3t7j4ZW8xQyjgXqrKI",
      authDomain: "evalflow-b3da2.firebaseapp.com",
      projectId: "evalflow-b3da2",
      storageBucket: "evalflow-b3da2.firebasestorage.app",
      messagingSenderId: "376143096721",
      appId: "1:376143096721:web:8399e278170f1c3f4f8830",
      measurementId: "G-CRL51V7SZL"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.firebaseAuth = { signInWithEmailAndPassword, signOut, onAuthStateChanged };
    window.firebaseFirestore = { collection, addDoc, updateDoc, deleteDoc, getDocs, query, where, doc, serverTimestamp };

    window.firebaseReady = true;
    window.dispatchEvent(new Event('firebaseready'));
  </script>

  <script>
    function startApp() {
      const { useState, useEffect, createElement: e } = React;

      // ── Icons ──────────────────────────────────────────────────────────────
      const Trash2 = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        e('polyline', { points: "3 6 5 6 21 6" }),
        e('path', { d: "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" })
      );
      const X = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('line', { x1: "18", y1: "6", x2: "6", y2: "18" }),
        e('line', { x1: "6", y1: "6", x2: "18", y2: "18" })
      );
      const Upload = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('path', { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }),
        e('polyline', { points: "17 8 12 3 7 8" }),
        e('line', { x1: "12", y1: "3", x2: "12", y2: "15" })
      );
      const FileDown = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('path', { d: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" }),
        e('polyline', { points: "14 2 14 8 20 8" }),
        e('path', { d: "M12 18v-6" }),
        e('path', { d: "M9 15l3 3 3-3" })
      );
      const LogOut = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('path', { d: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" }),
        e('polyline', { points: "16 17 21 12 16 7" }),
        e('line', { x1: "21", y1: "12", x2: "9", y2: "12" })
      );
      const Plus = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('line', { x1: "12", y1: "5", x2: "12", y2: "19" }),
        e('line', { x1: "5", y1: "12", x2: "19", y2: "12" })
      );
      const CheckSquare = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('polyline', { points: "9 11 12 14 22 4" }),
        e('path', { d: "M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" })
      );
      const Square = ({ size = 20 }) => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" },
        e('rect', { x: "3", y: "3", width: "18", height: "18", rx: "2", ry: "2" })
      );

      // ── Main component ─────────────────────────────────────────────────────
      function HamSanj() {
        const [currentUser, setCurrentUser] = useState(null);
        const [userRole, setUserRole] = useState(null);
        const [loading, setLoading] = useState(true);
        const [loadingPublicData, setLoadingPublicData] = useState(false);
        const [view, setView] = useState('login');
        const [courses, setCourses] = useState([]);
        const [sections, setSections] = useState([]);
        const [students, setStudents] = useState([]);
        const [groups, setGroups] = useState([]);
        const [evaluations, setEvaluations] = useState([]);
        const [criteria, setCriteria] = useState([]);
        const [selectedCourse, setSelectedCourse] = useState(null);
        const [selectedSection, setSelectedSection] = useState(null);
        const [loginEmail, setLoginEmail] = useState('');
        const [loginPassword, setLoginPassword] = useState('');
        const [studentName, setStudentName] = useState('');
        const [studentEmail, setStudentEmail] = useState('');
        const [courseName, setCourseName] = useState('');
        const [sectionName, setSectionName] = useState('');
        const [presentationScores, setPresentationScores] = useState({});
        const [groupScores, setGroupScores] = useState({});
        const [submittedEvals, setSubmittedEvals] = useState(new Set());
        const [activeTab, setActiveTab] = useState('courses');
        const [error, setError] = useState('');
        const [success, setSuccess] = useState('');
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        const [showBulkImport, setShowBulkImport] = useState(false);
        const [importFile, setImportFile] = useState(null);
        const [importPreview, setImportPreview] = useState([]);
        const [importing, setImporting] = useState(false);
        const [importProgress, setImportProgress] = useState('');
        const [criteriaName, setCriteriaName] = useState('');
        const [criteriaType, setCriteriaType] = useState('presentation');
        const [criteriaQuestions, setCriteriaQuestions] = useState([]);
        const [newQuestion, setNewQuestion] = useState('');
        const [editingCriteria, setEditingCriteria] = useState(null);
        const [selectedStudents, setSelectedStudents] = useState(new Set());
        const [bulkDeleteConfirm, setBulkDeleteConfirm] = useState(false);
        const [showAddStudent, setShowAddStudent] = useState(false);
        const [newStudentName, setNewStudentName] = useState('');
        const [newStudentEmail, setNewStudentEmail] = useState('');
        const [newStudentId, setNewStudentId] = useState('');
        const [newStudentSection, setNewStudentSection] = useState('');
        const [newStudentOrder, setNewStudentOrder] = useState('');
        const [newStudentGroup, setNewStudentGroup] = useState('');
        const [editingStudent, setEditingStudent] = useState(null);
        const [editingCourse, setEditingCourse] = useState(null);
        const [editingCourseName, setEditingCourseName] = useState('');
        const [editingSectionItem, setEditingSectionItem] = useState(null);
        const [editingSectionNameVal, setEditingSectionNameVal] = useState('');

        // ── Data loading ─────────────────────────────────────────────────────

        // FIX: Load sections/students/criteria publicly (no auth required).
        // Called on initial mount so the student login dropdown is populated.
        const loadPublicData = async () => {
          setLoadingPublicData(true);
          try {
            const { collection, getDocs } = window.firebaseFirestore;
            const [sectionsSnap, studentsSnap, criteriaSnap, groupsSnap] = await Promise.all([
              getDocs(collection(window.db, 'sections')),
              getDocs(collection(window.db, 'students')),
              getDocs(collection(window.db, 'criteria')),
              getDocs(collection(window.db, 'groups')),
            ]);
            setSections(sectionsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setStudents(studentsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setCriteria(criteriaSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setGroups(groupsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          } catch (err) {
            console.error('Public data load error:', err);
          } finally {
            setLoadingPublicData(false);
          }
        };

        const loadInstructorData = async (uid) => {
          try {
            const { collection, getDocs, query, where } = window.firebaseFirestore;
            const coursesRef = collection(window.db, 'courses');
            const coursesQuery = query(coursesRef, where('instructorId', '==', uid));
            const [coursesSnap, sectionsSnap, studentsSnap, groupsSnap, evalsSnap, criteriaSnap] = await Promise.all([
              getDocs(coursesQuery),
              getDocs(collection(window.db, 'sections')),
              getDocs(collection(window.db, 'students')),
              getDocs(collection(window.db, 'groups')),
              getDocs(collection(window.db, 'evaluations')),
              getDocs(collection(window.db, 'criteria')),
            ]);
            setCourses(coursesSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setSections(sectionsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setStudents(studentsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setGroups(groupsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setEvaluations(evalsSnap.docs.map(d => ({ id: d.id, ...d.data() })));
            setCriteria(criteriaSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          } catch (err) {
            console.error('Instructor data load error:', err);
            setError('Failed to load data');
          }
        };

        // On mount: check Firebase auth AND load public data so student
        // login form is always populated with sections.
        useEffect(() => {
          loadPublicData(); // load now, before auth resolves
          const unsubscribe = window.firebaseAuth.onAuthStateChanged(window.auth, (user) => {
            if (user) {
              setCurrentUser(user);
              setUserRole('instructor');
              setView('dashboard');
              loadInstructorData(user.uid);
            } else {
              setCurrentUser(null);
              setUserRole(null);
            }
            setLoading(false);
          });
          return unsubscribe;
        }, []);

        // ── Auth handlers ────────────────────────────────────────────────────

        const handleInstructorLogin = async (ev) => {
          ev.preventDefault();
          setError('');
          try {
            await window.firebaseAuth.signInWithEmailAndPassword(window.auth, loginEmail, loginPassword);
          } catch (err) {
            setError('Login failed: ' + err.message);
          }
        };

        const handleStudentLogin = async (ev) => {
          ev.preventDefault();
          setError('');
          if (!studentName.trim() || !studentEmail.trim() || !selectedSection) {
            setError('Please fill in all fields and select your section');
            return;
          }
          // FIX: re-fetch public data if sections were empty when page loaded
          if (sections.length === 0) {
            await loadPublicData();
          }
          const normalizedEmail = studentEmail.trim().toLowerCase();
          const student = students.find(
            s => s.email.toLowerCase() === normalizedEmail && s.sectionId === selectedSection
          );
          if (!student) {
            setError('Student not found in this section. Check your email and section selection.');
            return;
          }
          // FIX: load this student's already-submitted evaluations from Firestore
          // so they can't double-submit after a page refresh.
          try {
            const { collection, getDocs, query, where } = window.firebaseFirestore;
            const prevEvalsSnap = await getDocs(
              query(collection(window.db, 'evaluations'),
                where('evaluatorEmail', '==', normalizedEmail),
                where('sectionId', '==', selectedSection)
              )
            );
            const prevEvals = prevEvalsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            setSubmittedEvals(new Set(prevEvals.map(ev => `${ev.type}-${ev.evaluatedStudentId}`)));
          } catch (err) {
            // Non-fatal: student just might be able to re-submit; instructor
            // can deduplicate in the report.
            console.warn('Could not check previous submissions:', err);
          }
          setCurrentUser({ ...student, name: studentName.trim() });
          setUserRole('student');
          setView('student-eval');
        };

        const handleLogout = async () => {
          if (userRole === 'instructor') await window.firebaseAuth.signOut(window.auth);
          setCurrentUser(null);
          setUserRole(null);
          setView('login');
          setStudentName('');
          setStudentEmail('');
          setSelectedSection(null);
          setSubmittedEvals(new Set());
          setPresentationScores({});
          setGroupScores({});
        };

        // ── Instructor CRUD ──────────────────────────────────────────────────

        const deleteItem = async (type, id) => {
          try {
            await window.firebaseFirestore.deleteDoc(window.firebaseFirestore.doc(window.db, type, id));
            setSuccess('Deleted successfully');
            setDeleteConfirm(null);
            if (type === 'criteria' && id === editingCriteria) cancelEditCriteria();
            if (type === 'courses' && id === editingCourse) { setEditingCourse(null); setEditingCourseName(''); }
            if (type === 'sections' && id === editingSectionItem) { setEditingSectionItem(null); setEditingSectionNameVal(''); }
            loadInstructorData(currentUser.uid);
          } catch (err) {
            setError('Delete failed: ' + err.message);
          }
        };

        const updateCourse = async (courseId) => {
          if (!editingCourseName.trim()) return;
          try {
            await window.firebaseFirestore.updateDoc(window.firebaseFirestore.doc(window.db, 'courses', courseId), {
              name: editingCourseName.trim()
            });
            setEditingCourse(null); setEditingCourseName('');
            setSuccess('Course updated');
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to update course: ' + err.message); }
        };

        const updateSection = async (sectionId) => {
          if (!editingSectionNameVal.trim()) return;
          try {
            await window.firebaseFirestore.updateDoc(window.firebaseFirestore.doc(window.db, 'sections', sectionId), {
              name: editingSectionNameVal.trim()
            });
            setEditingSectionItem(null); setEditingSectionNameVal('');
            setSuccess('Section updated');
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to update section: ' + err.message); }
        };

        const addCourse = async () => {
          if (!courseName.trim()) return;
          try {
            await window.firebaseFirestore.addDoc(window.firebaseFirestore.collection(window.db, 'courses'), {
              name: courseName.trim(),
              instructorId: currentUser.uid,
              createdAt: window.firebaseFirestore.serverTimestamp()
            });
            setCourseName('');
            setSuccess('Course added');
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to add course'); }
        };

        const addSection = async () => {
          if (!sectionName.trim() || !selectedCourse) {
            setError('Select a course and enter a section name');
            return;
          }
          try {
            await window.firebaseFirestore.addDoc(window.firebaseFirestore.collection(window.db, 'sections'), {
              name: sectionName.trim(),
              courseId: selectedCourse,
              createdAt: window.firebaseFirestore.serverTimestamp()
            });
            setSectionName('');
            setSuccess('Section added');
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to add section'); }
        };

        const saveCriteria = async () => {
          if (!criteriaName.trim() || criteriaQuestions.length === 0) {
            setError('Enter a name and add at least one question');
            return;
          }
          try {
            if (editingCriteria) {
              await window.firebaseFirestore.updateDoc(window.firebaseFirestore.doc(window.db, 'criteria', editingCriteria), {
                name: criteriaName.trim(),
                type: criteriaType,
                questions: criteriaQuestions,
                updatedAt: window.firebaseFirestore.serverTimestamp()
              });
              setSuccess('Criteria updated');
            } else {
              await window.firebaseFirestore.addDoc(window.firebaseFirestore.collection(window.db, 'criteria'), {
                name: criteriaName.trim(),
                type: criteriaType,
                questions: criteriaQuestions,
                instructorId: currentUser.uid,
                createdAt: window.firebaseFirestore.serverTimestamp()
              });
              setSuccess('Criteria added');
            }
            setCriteriaName(''); setCriteriaType('presentation'); setCriteriaQuestions([]); setEditingCriteria(null);
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to save criteria: ' + err.message); }
        };

        const addQuestion = () => {
          if (!newQuestion.trim()) return;
          setCriteriaQuestions([...criteriaQuestions, newQuestion.trim()]);
          setNewQuestion('');
        };
        const removeQuestion = (index) => setCriteriaQuestions(criteriaQuestions.filter((_, i) => i !== index));
        const startEditCriteria = (crit) => {
          setEditingCriteria(crit.id); setCriteriaName(crit.name); setCriteriaType(crit.type);
          setCriteriaQuestions(crit.questions || []);
        };
        const cancelEditCriteria = () => {
          setEditingCriteria(null); setCriteriaName(''); setCriteriaType('presentation'); setCriteriaQuestions([]);
        };

        const assignCriteriaToSection = async (sectionId, criteriaId, type) => {
          try {
            await window.firebaseFirestore.updateDoc(window.firebaseFirestore.doc(window.db, 'sections', sectionId), {
              [`${type}CriteriaId`]: criteriaId
            });
            setSuccess('Criteria assigned');
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to assign criteria'); }
        };

        // ── Student eval submission ─────────────────────────────────────────

        const submitEvalWithCriteria = async (evaluatedStudentId, type, scoresByIndex) => {
          const section = sections.find(s => s.id === selectedSection);
          const criteriaId = type === 'presentation' ? section?.presentationCriteriaId : section?.groupCriteriaId;
          const criteriaTemplate = criteria.find(c => c.id === criteriaId);
          if (!criteriaTemplate) { setError('No criteria template found for this section'); return; }

          // FIX: build scores array by explicit question index (not Object.values order)
          const scoresArray = criteriaTemplate.questions.map((_, i) => scoresByIndex[i]);
          const allAnswered = scoresArray.every(s => s !== undefined && s !== '' && parseInt(s) >= 1 && parseInt(s) <= 10);
          if (!allAnswered) { setError('Please rate all questions (1–10)'); return; }

          try {
            const parsedScores = scoresArray.map(s => parseInt(s));
            await window.firebaseFirestore.addDoc(window.firebaseFirestore.collection(window.db, 'evaluations'), {
              evaluatorEmail: currentUser.email.toLowerCase(),
              evaluatedStudentId,
              sectionId: selectedSection,
              type,
              criteriaId: criteriaTemplate.id,
              scores: parsedScores,
              score: parsedScores.reduce((sum, s) => sum + s, 0) / parsedScores.length,
              timestamp: window.firebaseFirestore.serverTimestamp()
            });
            setSubmittedEvals(prev => new Set([...prev, `${type}-${evaluatedStudentId}`]));
            if (type === 'presentation') {
              setPresentationScores(prev => { const n = { ...prev }; delete n[evaluatedStudentId]; return n; });
            } else {
              setGroupScores(prev => { const n = { ...prev }; delete n[evaluatedStudentId]; return n; });
            }
            setSuccess('Evaluation submitted!');
            setTimeout(() => setSuccess(''), 3000);
          } catch (err) { setError('Failed to submit: ' + err.message); }
        };

        const submitSimpleEval = async (evaluatedStudentId, type, score) => {
          const s = parseInt(score);
          if (!score || s < 1 || s > 10) { setError('Score must be between 1 and 10'); return; }
          try {
            await window.firebaseFirestore.addDoc(window.firebaseFirestore.collection(window.db, 'evaluations'), {
              evaluatorEmail: currentUser.email.toLowerCase(),
              evaluatedStudentId,
              sectionId: selectedSection,
              type,
              score: s,
              timestamp: window.firebaseFirestore.serverTimestamp()
            });
            setSubmittedEvals(prev => new Set([...prev, `${type}-${evaluatedStudentId}`]));
            if (type === 'presentation') {
              setPresentationScores(prev => { const n = { ...prev }; delete n[evaluatedStudentId]; return n; });
            } else {
              setGroupScores(prev => { const n = { ...prev }; delete n[evaluatedStudentId]; return n; });
            }
            setSuccess('Evaluation submitted!');
            setTimeout(() => setSuccess(''), 3000);
          } catch (err) { setError('Failed to submit: ' + err.message); }
        };

        // ── Reports / export ─────────────────────────────────────────────────

        const exportToCSV = () => {
          if (!selectedSection) { setError('Select a section first'); return; }
          const sectionStudents = students.filter(s => s.sectionId === selectedSection);
          const rows = ['Student Name,Student ID,Email,Presentation Avg,Presentation Count,Group Avg,Group Count,Overall Avg,Total Evals'];
          sectionStudents.forEach(student => {
            const presEvals = evaluations.filter(ev => ev.evaluatedStudentId === student.id && ev.type === 'presentation');
            const groupEvals = evaluations.filter(ev => ev.evaluatedStudentId === student.id && ev.type === 'group');
            const presAvg = presEvals.length > 0 ? (presEvals.reduce((sum, ev) => sum + ev.score, 0) / presEvals.length).toFixed(2) : 'N/A';
            const groupAvg = groupEvals.length > 0 ? (groupEvals.reduce((sum, ev) => sum + ev.score, 0) / groupEvals.length).toFixed(2) : 'N/A';
            const all = [...presEvals, ...groupEvals];
            const overall = all.length > 0 ? (all.reduce((sum, ev) => sum + ev.score, 0) / all.length).toFixed(2) : 'N/A';
            rows.push(`"${student.name}","${student.studentId || ''}","${student.email}",${presAvg},${presEvals.length},${groupAvg},${groupEvals.length},${overall},${all.length}`);
          });
          const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `HamSanj_${sections.find(s => s.id === selectedSection)?.name.replace(/\s/g, '_')}_${new Date().toISOString().split('T')[0]}.csv`;
          a.click(); URL.revokeObjectURL(url);
          setSuccess('Exported successfully');
        };

        // ── Student management ───────────────────────────────────────────────

        const addStudent = async () => {
          if (!newStudentName.trim() || !newStudentSection) {
            setError('Name and section are required'); return;
          }
          try {
            await window.firebaseFirestore.addDoc(window.firebaseFirestore.collection(window.db, 'students'), {
              name: newStudentName.trim(),
              email: newStudentEmail.trim().toLowerCase(),
              studentId: newStudentId.trim(),
              sectionId: newStudentSection,
              presentationOrder: parseInt(newStudentOrder) || 999,
              groupId: newStudentGroup.trim() || null,
              createdAt: window.firebaseFirestore.serverTimestamp()
            });
            setSuccess('Student added');
            setNewStudentName(''); setNewStudentEmail(''); setNewStudentId('');
            setNewStudentSection(''); setNewStudentOrder(''); setNewStudentGroup('');
            setShowAddStudent(false);
            loadInstructorData(currentUser.uid);
          } catch (err) { setError('Failed to add student'); }
        };

        const startEditStudent = (student) => {
          setEditingStudent(student.id); setNewStudentName(student.name);
          setNewStudentEmail(student.email); setNewStudentId(student.studentId || '');
          setNewStudentSection(student.sectionId); setNewStudentOrder(student.presentationOrder?.toString() || '');
          setNewStudentGroup(student.groupId || ''); setShowAddStudent(true);
        };

        const updateStudent = async () => {
          if (!newStudentName.trim() || !newStudentSection) {
            setError('Name and section are required'); return;
          }
          try {
            await window.firebaseFirestore.updateDoc(window.firebaseFirestore.doc(window.db, 'students', editingStudent), {
              name: newStudentName.trim(),

        // ── CSV import ───────────────────────────────────────────────────────

        const handleImportFileChange = (ev) => {
          const file = ev.target.files[0];

          setImportFile(file);
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const text = ev.target.result;
              const lines = text.split('\n').filter(l => l.trim());
              if (!lines.length) { setError('CSV file is empty'); return; }

              const parseCSVLine = (line) => {
                const result = []; let cur = ''; let inQ = false;
                for (const c of line) {
                  if (c === '"') { inQ = !inQ; }
                  else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
                  else { cur += c; }
                }
                result.push(cur.trim());
                return result;
              };

              const firstLineLower = lines[0].toLowerCase();
              const isCanvas = firstLineLower.includes('sis login id') || (firstLineLower.includes('student') && firstLineLower.includes('section') && firstLineLower.includes('id'));
              const isTemplate = !isCanvas && firstLineLower.includes('name') && firstLineLower.includes('email');
              const data = [];

              if (isCanvas) {
                const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim());
                const iStudent = headers.findIndex(h => h === 'student');
                const iLogin = headers.findIndex(h => h.includes('sis login'));
                const iUID = headers.findIndex(h => h.includes('sis user'));
                const iSection = headers.findIndex(h => h === 'section');
                for (let i = 1; i < lines.length; i++) {
                  const vals = parseCSVLine(lines[i]);
                  const rawName = iStudent >= 0 ? (vals[iStudent] || '') : '';
                  if (!rawName || rawName.toLowerCase().includes('points possible')) continue;
                  const loginCheck = iLogin >= 0 ? (vals[iLogin] || '').trim() : '';
                  if (/^[0-9a-f]{20,}$/i.test(loginCheck)) continue;
                  const nameParts = rawName.split(',').map(p => p.trim());
                  if (nameParts[0].toLowerCase() === 'student' && nameParts[1]?.toLowerCase() === 'test') continue;
                  const name = nameParts.length > 1 ? `${nameParts[1]} ${nameParts[0]}` : nameParts[0];
                  if (!name) continue;
                  const loginId = iLogin >= 0 ? (vals[iLogin] || '').trim() : '';
                  const email = loginId ? `${loginId}@terpmail.umd.edu` : '';
                  const section = iSection >= 0 ? (vals[iSection] || '').trim() : '';
                  const studentId = iUID >= 0 ? (vals[iUID] || '').trim() : '';
                  data.push({ name, email, studentid: studentId, section });
                }
              } else if (isTemplate) {
                const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim());
                for (let i = 1; i < lines.length; i++) {
                  if (!lines[i].trim()) continue;
                  const vals = parseCSVLine(lines[i]);
                  const row = {};
                  headers.forEach((h, idx) => { row[h] = vals[idx] || ''; });
                  data.push(row);
                }
              } else {
                for (let i = 0; i < lines.length; i++) {
                  const vals = parseCSVLine(lines[i]);
                  if (vals.length >= 1 && vals[0]) {
                    data.push({ name: vals[0], email: vals[1] || '', studentid: '', section: '' });
                  }
                }
              }

              setImportPreview(data); setError('');
            } catch (err) { setError('Could not parse CSV file: ' + err.message); }
          };
          reader.readAsText(file);

        const findSectionMatch = (rawSection) => {

                      ),
                      importProgress && e('p', { className: "text-sm mb-2", style: { color: '#7b2d5e' } }, importProgress),
                      e('button', { onClick: handleBulkImport, disabled: importing, className: "w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50" },
                        importing ? importProgress || 'Importing...' : `Import ${importPreview.length} Students`
                      )
                    )
                  )
                ),
                e('div', { className: "bg-white p-6 rounded-lg shadow" },
                  e('h2', { className: "text-xl font-bold mb-4" }, 'All Students'),
                  e('select', { value: selectedSection || '', onChange: ev => setSelectedSection(ev.target.value), className: "w-full px-4 py-2 border rounded-lg mb-4" },
                    e('option', { value: "" }, 'All Sections'),
                    sections.map(s => e('option', { key: s.id, value: s.id }, s.name))
                  ),
                  visibleStudents.length > 0 && e('div', { className: "mb-4 flex flex-wrap gap-2" },
                    e('button', { onClick: toggleSelectAll, className: "inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 whitespace-nowrap" },
                      selectedStudents.size === visibleStudents.length && visibleStudents.length > 0 ? e(CheckSquare, { size: 18 }) : e(Square, { size: 18 }),
                      selectedStudents.size === visibleStudents.length && visibleStudents.length > 0 ? 'Deselect All' : 'Select All'
                    ),
                    selectedStudents.size > 0 && e('button', { onClick: () => setBulkDeleteConfirm(true), className: "inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 whitespace-nowrap" },
                      e(Trash2, { size: 18 }), `Delete ${selectedStudents.size} Selected`
                    )
                  ),
                  visibleStudents.length === 0
                    ? e('p', { className: "text-gray-500" }, 'No students yet')
                    : e('div', { className: "space-y-2" },
                        visibleStudents
                          .sort((a, b) => (a.presentationOrder || 999) - (b.presentationOrder || 999))
                          .map(student => {
                            const section = sections.find(s => s.id === student.sectionId);
                            const isSelected = selectedStudents.has(student.id);
                            return e('div', { key: student.id, className: `flex items-center gap-3 p-4 border rounded-lg hover:bg-gray-50 ${isSelected ? 'bg-blue-50 border-blue-300' : ''}` },
                              e('button', { onClick: () => toggleStudentSelection(student.id), className: "flex-shrink-0" },
                                isSelected ? e(CheckSquare, { size: 20 }) : e(Square, { size: 20 })
                              ),
                              e('div', { className: "flex-1 min-w-0" },
                                e('div', { className: "font-medium" }, student.name),
                                e('div', { className: "text-sm text-gray-600 truncate" },
                                  `${student.email || '(no email)'}${section ? ` • ${section.name}` : ' • No section'}${student.groupId ? ` • Group: ${student.groupId}` : ''}`
                                )
                              ),
                              e('div', { className: "flex gap-2 flex-shrink-0" },
                                e('button', { onClick: () => startEditStudent(student), className: "px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 whitespace-nowrap" }, 'Edit'),
                                e('button', { onClick: () => setDeleteConfirm({ type: 'students', id: student.id, name: student.name }), className: "p-2 text-red-600 hover:bg-red-50 rounded" }, e(Trash2, { size: 18 }))
                              )
                            );
                          })
                      )
                )
              ),

              // Criteria tab
              activeTab === 'criteria' && e('div', { className: "space-y-6" },
                e('div', { className: "bg-white p-6 rounded-lg shadow" },
                  e('h2', { className: "text-xl font-bold mb-4" }, editingCriteria ? 'Edit Evaluation Criteria' : 'Create Evaluation Criteria'),
                  e('div', { className: "space-y-4" },
                    e('input', { type: "text", placeholder: "Criteria Name (e.g., Group Peer Review Rubric)", value: criteriaName, onChange: ev => setCriteriaName(ev.target.value), className: "w-full px-4 py-2 border rounded-lg" }),
                    e('select', { value: criteriaType, onChange: ev => setCriteriaType(ev.target.value), className: "w-full px-4 py-2 border rounded-lg" },
                      e('option', { value: "presentation" }, 'Presentation Evaluation'),
                      e('option', { value: "group" }, 'Group Member Evaluation')
                    ),
                    e('div', { className: "border rounded-lg p-4" },
                      e('h3', { className: "font-medium mb-3" }, 'Questions (each rated 1–10 by peers)'),
                      criteriaQuestions.length === 0
                        ? e('p', { className: "text-gray-500 text-sm mb-3" }, 'No questions yet. Add at least one below.')
                        : e('div', { className: "space-y-2 mb-3" },
                            criteriaQuestions.map((q, i) =>
                              e('div', { key: i, className: "flex justify-between items-center p-2 bg-gray-50 rounded" },
                                e('span', { className: "text-sm" }, `${i + 1}. ${q}`),
                                e('button', { onClick: () => removeQuestion(i), className: "text-red-600 hover:text-red-700 flex-shrink-0 ml-2" }, e(X, { size: 16 }))
                              )
                            )
                          ),
                      e('div', { className: "flex gap-2" },
                        e('input', { type: "text", placeholder: "e.g., Contributed equally to the project", value: newQuestion, onChange: ev => setNewQuestion(ev.target.value), onKeyPress: ev => ev.key === 'Enter' && (ev.preventDefault(), addQuestion()), className: "flex-1 px-3 py-2 border rounded-lg text-sm" }),
                        e('button', { onClick: addQuestion, className: "inline-flex items-center gap-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 whitespace-nowrap" },
                          e(Plus, { size: 16 }), 'Add'
                        )
                      )
                    ),
                    e('div', { className: "flex gap-2" },
                      editingCriteria && e('button', { onClick: cancelEditCriteria, className: "px-6 py-2 border rounded-lg hover:bg-gray-50" }, 'Cancel'),
                      e('button', { onClick: saveCriteria, className: "flex-1 px-6 py-2 text-white rounded-lg hover:opacity-90", style: { backgroundColor: '#7b2d5e' } },
                        editingCriteria ? 'Update Criteria' : 'Save Criteria'
                      )
                    )
                  )
                ),
                e('div', { className: "bg-white p-6 rounded-lg shadow" },
                  e('h2', { className: "text-xl font-bold mb-4" }, 'Your Evaluation Criteria'),
                  criteria.length === 0
                    ? e('p', { className: "text-gray-500" }, 'No criteria yet. Create one above.')
                    : e('div', { className: "space-y-3" },
                        criteria.map(crit => e('div', { key: crit.id, className: "border rounded-lg p-4 hover:bg-gray-50" },
                          e('div', { className: "flex justify-between items-start mb-2" },
                            e('div', null,
                              e('h3', { className: "font-medium" }, crit.name),
                              e('p', { className: "text-sm text-gray-600 capitalize" }, `Type: ${crit.type}`)
                            ),
                            e('div', { className: "flex gap-2" },
                              e('button', { onClick: () => startEditCriteria(crit), className: "px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 whitespace-nowrap" }, 'Edit'),
                              e('button', { onClick: () => setDeleteConfirm({ type: 'criteria', id: crit.id, name: crit.name }), className: "p-1 text-red-600 hover:bg-red-50 rounded" }, e(Trash2, { size: 16 }))
                            )
                          ),
                          e('div', { className: "text-sm" },
                            e('p', { className: "font-medium mb-1" }, `${(crit.questions || []).length} question(s):`),
                            e('ol', { className: "list-decimal list-inside space-y-1 text-gray-700" },
                              (crit.questions || []).map((q, i) => e('li', { key: i }, q))
                            )
                          )
                        ))
                      )
                )
              ),

              // Reports tab
              activeTab === 'reports' && e('div', { className: "space-y-6" },
                e('div', { className: "bg-white p-6 rounded-lg shadow" },
                  e('h2', { className: "text-xl font-bold mb-4" }, 'Export Evaluation Report'),
                  e('select', { value: selectedSection || '', onChange: ev => setSelectedSection(ev.target.value), className: "w-full px-4 py-2 border rounded-lg mb-4" },
                    e('option', { value: "" }, 'Select Section'),
                    sections.map(s => e('option', { key: s.id, value: s.id }, s.name))
                  ),
                  e('button', { onClick: exportToCSV, className: "w-full inline-flex items-center justify-center gap-2 px-4 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700" },
                    e(FileDown, { size: 20 }), 'Export to CSV'
                  )
                ),
                selectedSection && e('div', { className: "bg-white p-6 rounded-lg shadow" },
                  e('h2', { className: "text-xl font-bold mb-4" }, 'Section Overview'),
                  students.filter(s => s.sectionId === selectedSection).length === 0
                    ? e('p', { className: "text-gray-500" }, 'No students in this section yet')
                    : e('div', { className: "space-y-4" },
                        students.filter(s => s.sectionId === selectedSection)
                          .sort((a, b) => (a.presentationOrder || 999) - (b.presentationOrder || 999))
                          .map(student => {
                            const presEvals = evaluations.filter(ev => ev.evaluatedStudentId === student.id && ev.type === 'presentation');
                            const groupEvals = evaluations.filter(ev => ev.evaluatedStudentId === student.id && ev.type === 'group');
                            const presAvg = presEvals.length > 0 ? (presEvals.reduce((s, ev) => s + ev.score, 0) / presEvals.length).toFixed(1) : 'N/A';
                            const groupAvg = groupEvals.length > 0 ? (groupEvals.reduce((s, ev) => s + ev.score, 0) / groupEvals.length).toFixed(1) : 'N/A';
                            return e('div', { key: student.id, className: "p-4 border rounded-lg" },
                              e('div', { className: "font-medium mb-1" }, student.name),
                              e('div', { className: "text-xs text-gray-500 mb-2" }, `${student.email}${student.groupId ? ` • Group ${student.groupId}` : ''}`),
                              e('div', { className: "grid grid-cols-2 gap-4 text-sm" },
                                e('div', null,
                                  e('span', { className: "text-gray-600" }, 'Presentation: '),
                                  e('span', { className: "font-medium" }, `${presAvg} (${presEvals.length} eval${presEvals.length !== 1 ? 's' : ''})`)
                                ),
                                e('div', null,
                                  e('span', { className: "text-gray-600" }, 'Group peer: '),
                                  e('span', { className: "font-medium" }, `${groupAvg} (${groupEvals.length} eval${groupEvals.length !== 1 ? 's' : ''})`)
                                )
                              )
                            );
                          })
                      )
                )
              )
            ),

            // Delete confirm modal
            deleteConfirm && e('div', { className: "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50", onClick: () => setDeleteConfirm(null) },
              e('div', { className: "bg-white p-6 rounded-lg shadow-xl max-w-md mx-4", onClick: ev => ev.stopPropagation() },
                e('h3', { className: "text-lg font-bold mb-2" }, 'Confirm Delete'),
                e('p', { className: "text-gray-600 mb-4" }, `Delete "${deleteConfirm.name}"? This cannot be undone.`),
                e('div', { className: "flex gap-2 justify-end" },
                  e('button', { onClick: () => setDeleteConfirm(null), className: "px-4 py-2 border rounded-lg hover:bg-gray-50" }, 'Cancel'),
                  e('button', { onClick: () => deleteItem(deleteConfirm.type, deleteConfirm.id), className: "px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700" }, 'Delete')
                )
              )
            ),

            // Bulk delete confirm modal
            bulkDeleteConfirm && e('div', { className: "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50", onClick: () => setBulkDeleteConfirm(false) },
              e('div', { className: "bg-white p-6 rounded-lg shadow-xl max-w-md mx-4", onClick: ev => ev.stopPropagation() },
                e('h3', { className: "text-lg font-bold mb-2" }, 'Confirm Bulk Delete'),
                e('p', { className: "text-gray-600 mb-4" }, `Delete ${selectedStudents.size} selected students? This cannot be undone.`),
                e('div', { className: "flex gap-2 justify-end" },
                  e('button', { onClick: () => setBulkDeleteConfirm(false), className: "px-4 py-2 border rounded-lg hover:bg-gray-50" }, 'Cancel'),
                  e('button', { onClick: bulkDeleteStudents, className: "px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700" }, 'Delete All')
                )
              )
            )
          );
        }

        // ── Student evaluation view ──────────────────────────────────────────

        const section = sections.find(s => s.id === selectedSection);
        const presentationCriteria = section?.presentationCriteriaId
          ? criteria.find(c => c.id === section.presentationCriteriaId) : null;
        const groupCriteria = section?.groupCriteriaId
          ? criteria.find(c => c.id === section.groupCriteriaId) : null;

        const presStudents = students
          .filter(s => s.sectionId === selectedSection && s.id !== currentUser.id)
          .sort((a, b) => (a.presentationOrder || 999) - (b.presentationOrder || 999));

        const groupStudents = students.filter(
          s => s.sectionId === selectedSection &&
               s.groupId && currentUser.groupId &&
               s.groupId === currentUser.groupId &&
               s.id !== currentUser.id
        );

        const totalPresRequired = presStudents.length;
        const totalGroupRequired = groupStudents.length;
        const presSubmitted = presStudents.filter(s => submittedEvals.has(`presentation-${s.id}`)).length;
        const groupSubmitted = groupStudents.filter(s => submittedEvals.has(`group-${s.id}`)).length;
        const allDone = presSubmitted === totalPresRequired && groupSubmitted === totalGroupRequired
          && (totalPresRequired + totalGroupRequired) > 0;

        return e('div', { className: "min-h-screen bg-gray-50" },
          e('div', { className: "bg-white shadow mb-6" },
            e('div', { className: "max-w-4xl mx-auto px-4 py-4 flex justify-between items-center" },
              e('div', null,
                e('h1', { className: "text-2xl font-bold", style: { color: '#7b2d5e' } }, 'HamSanj — Peer Evaluation'),
                e('p', { className: "text-sm text-gray-600" },
                  `${currentUser.name} • ${section?.name || ''}${currentUser.groupId ? ` • Group ${currentUser.groupId}` : ''}`
                )
              ),
              e('button', { onClick: handleLogout, className: "inline-flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700" },
                e(LogOut, { size: 18 }), 'Logout'
              )
            )
          ),
          e('div', { className: "max-w-4xl mx-auto px-4 pb-12" },
            error && e('div', { className: "mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm flex justify-between items-center" },
              error, e('button', { onClick: () => setError('') }, e(X, { size: 16 }))
            ),
            success && e('div', { className: "mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm" }, success),

            // Progress bar
            e('div', { className: "mb-6 p-4 bg-white rounded-lg shadow" },
              e('p', { className: "text-sm font-medium mb-2" },
                `Progress: ${presSubmitted + groupSubmitted} / ${totalPresRequired + totalGroupRequired} evaluations submitted`
              ),
              e('div', { className: "w-full bg-gray-200 rounded-full h-2" },
                e('div', {
                  className: "h-2 rounded-full transition-all",
                  style: {
                    backgroundColor: '#7b2d5e',
                    width: (totalPresRequired + totalGroupRequired) > 0
                      ? `${Math.round((presSubmitted + groupSubmitted) / (totalPresRequired + totalGroupRequired) * 100)}%`
                      : '0%'
                  }
                })
              )
            ),

            // All done banner
            allDone && e('div', { className: "mb-6 p-4 bg-green-50 border border-green-300 rounded-lg text-center" },
              e('p', { className: "text-green-700 font-medium text-lg" }, '🎉 All evaluations submitted!'),
              e('p', { className: "text-green-600 text-sm mt-1" }, 'Thank you. You may now close this page.')
            ),

            e('div', { className: "grid md:grid-cols-2 gap-6" },

              // Presentation evaluations
              e('div', { className: "bg-white p-6 rounded-lg shadow" },
                e('h2', { className: "text-xl font-bold mb-1" }, 'Presentation Evaluations'),
                e('p', { className: "text-sm text-gray-500 mb-4" }, `${presSubmitted} / ${totalPresRequired} submitted`),
                presentationCriteria && e('div', { className: "mb-4 p-3 bg-blue-50 rounded-lg" },
                  e('p', { className: "text-sm font-medium" }, presentationCriteria.name),
                  e('p', { className: "text-xs text-gray-600 mt-1" }, 'Rate each question 1 (lowest) – 10 (highest)')
                ),
                presStudents.length === 0
                  ? e('p', { className: "text-gray-500 text-sm" }, 'No other students in this section.')
                  : presStudents.map(student => {
                      const submitted = submittedEvals.has(`presentation-${student.id}`);
                      return e('div', { key: student.id, className: `mb-4 p-4 border rounded-lg ${submitted ? 'bg-green-50 border-green-200' : ''}` },
                        e('div', { className: "font-medium mb-2" },
                          student.name
                        ),
                        submitted
                          ? e('p', { className: "text-sm text-green-600 font-medium" }, '✓ Submitted')
                          : presentationCriteria && presentationCriteria.questions
                            ? e('div', { className: "space-y-3" },
                                presentationCriteria.questions.map((q, i) =>
                                  e('div', { key: i, className: "flex flex-col gap-1" },
                                    e('label', { className: "text-sm text-gray-700" }, `${i + 1}. ${q}`),
                                    e('input', {
                                      type: "number", min: "1", max: "10", placeholder: "1–10",
                                      value: (presentationScores[student.id] || {})[i] || '',
                                      onChange: ev => setPresentationScores(prev => ({
                                        ...prev,
                                        [student.id]: { ...(prev[student.id] || {}), [i]: ev.target.value }
                                      })),
                                      className: "px-3 py-2 border rounded-lg w-24"
                                    })
                                  )
                                ),
                                e('button', {
                                  onClick: () => submitEvalWithCriteria(student.id, 'presentation', presentationScores[student.id] || {}),
                                  className: "w-full mt-2 px-4 py-2 text-white rounded-lg hover:opacity-90",
                                  style: { backgroundColor: '#7b2d5e' }
                                }, 'Submit Evaluation')
                              )
                            : e('div', { className: "flex gap-2 items-center" },
                                e('input', {
                                  type: "number", min: "1", max: "10", placeholder: "Score (1–10)",
                                  value: presentationScores[student.id] || '',
                                  onChange: ev => setPresentationScores(prev => ({ ...prev, [student.id]: ev.target.value })),
                                  className: "flex-1 px-3 py-2 border rounded-lg"
                                }),
                                e('button', {
                                  onClick: () => submitSimpleEval(student.id, 'presentation', presentationScores[student.id]),
                                  className: "px-4 py-2 text-white rounded-lg hover:opacity-90 whitespace-nowrap",
                                  style: { backgroundColor: '#7b2d5e' }
                                }, 'Submit')
                              )
                      );
                    })
              ),

              // Group member evaluations
              e('div', { className: "bg-white p-6 rounded-lg shadow" },
                e('h2', { className: "text-xl font-bold mb-1" }, 'Group Member Evaluations'),
                e('p', { className: "text-sm text-gray-500 mb-4" }, `${groupSubmitted} / ${totalGroupRequired} submitted`),
                groupCriteria && e('div', { className: "mb-4 p-3 bg-green-50 rounded-lg" },
                  e('p', { className: "text-sm font-medium" }, groupCriteria.name),
                  e('p', { className: "text-xs text-gray-600 mt-1" }, 'Rate each question 1 (lowest) – 10 (highest)')
                ),
                // FIX: show helpful message when student has no group members
                !currentUser.groupId
                  ? e('p', { className: "text-gray-500 text-sm" }, 'You are not assigned to a group. No group evaluations required.')
                  : groupStudents.length === 0
                    ? e('p', { className: "text-gray-500 text-sm" }, `No other students in group "${currentUser.groupId}". If this is unexpected, ask your instructor to check group assignments.`)
                    : groupStudents.map(student => {
                        const submitted = submittedEvals.has(`group-${student.id}`);
                        return e('div', { key: student.id, className: `mb-4 p-4 border rounded-lg ${submitted ? 'bg-green-50 border-green-200' : ''}` },
                          e('div', { className: "font-medium mb-2" }, student.name),
                          submitted
                            ? e('p', { className: "text-sm text-green-600 font-medium" }, '✓ Submitted')
                            : groupCriteria && groupCriteria.questions
                              ? e('div', { className: "space-y-3" },
                                  groupCriteria.questions.map((q, i) =>
                                    e('div', { key: i, className: "flex flex-col gap-1" },
                                      e('label', { className: "text-sm text-gray-700" }, `${i + 1}. ${q}`),
                                      e('input', {
                                        type: "number", min: "1", max: "10", placeholder: "1–10",
                                        value: (groupScores[student.id] || {})[i] || '',
                                        onChange: ev => setGroupScores(prev => ({
                                          ...prev,
                                          [student.id]: { ...(prev[student.id] || {}), [i]: ev.target.value }
                                        })),
                                        className: "px-3 py-2 border rounded-lg w-24"
                                      })
                                    )
                                  ),
                                  e('button', {
                                    onClick: () => submitEvalWithCriteria(student.id, 'group', groupScores[student.id] || {}),
                                    className: "w-full mt-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
                                  }, 'Submit Evaluation')
                                )
                              : e('div', { className: "flex gap-2 items-center" },
                                  e('input', {
                                    type: "number", min: "1", max: "10", placeholder: "Score (1–10)",
                                    value: groupScores[student.id] || '',
                                    onChange: ev => setGroupScores(prev => ({ ...prev, [student.id]: ev.target.value })),
                                    className: "flex-1 px-3 py-2 border rounded-lg"
                                  }),
                                  e('button', {
                                    onClick: () => submitSimpleEval(student.id, 'group', groupScores[student.id]),
                                    className: "px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 whitespace-nowrap"
                                  }, 'Submit')
                                )
                        );
                      })
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(HamSanj));
    }

    if (window.firebaseReady) {
      startApp();
    } else {
      window.addEventListener('firebaseready', startApp);
    }
  </script>

</body>
</html>
